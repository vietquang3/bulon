name: BoxController
options:
  bundleIdPrefix: com.motionboxing
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  BoxController:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: BoxController
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Box Controller
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        NSLocalNetworkUsageDescription: "Gửi nút âm lượng tới máy tính trong mạng Wi-Fi để điều khiển game."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.motionboxing.BoxController
        TARGETED_DEVICE_FAMILY: "1"
